{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BuildAI</title><link rel="stylesheet" href="{% static 'studio/style.css' %}"></head><body><header><a class="logo" href="{% url 'home' %}">◩ BuildAI</a><nav>{% if user.is_authenticated %}<a href="{% url 'projects' %}">My projects</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="ghost">Sign out</button></form>{% else %}<a href="{% url 'login' %}">Sign in</a><a class="small-button" href="{% url 'signup' %}">Create account</a>{% endif %}</nav></header><main>{% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>Concept sketches are visual exploration, not construction drawings.</footer></body></html>
