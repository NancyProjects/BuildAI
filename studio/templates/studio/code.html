{% extends 'studio/base.html' %}{% block content %}<section class="panel form-panel"><h1>Check your email</h1><p>Enter the six-digit sign-in code. It expires in 10 minutes.</p><form method="post" action="{% url 'confirm_login_code' %}">{% csrf_token %}<label for="code">Sign-in code</label><input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"><button>Verify and sign in</button></form></section>{% endblock %}
